# Use explicitly selected installations instead of stale, removed local JDKs.
# JAVA_HOME supplies the Java 25 compiler and default test runtime.
# JAVA26_HOME supplies the optional Java 26 compatibility test runtime.
org.gradle.java.installations.fromEnv=JAVA_HOME,JAVA26_HOME
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false
