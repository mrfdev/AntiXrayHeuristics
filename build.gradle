import org.apache.tools.ant.filters.ReplaceTokens

plugins {
    id 'java'
}

def artifactName = '1MB-XRayHeuristics'
def internalPluginName = 'xrayheuristics'
def versionPropertiesFile = file('version.properties')
def versionProperties = new Properties()

if (!versionPropertiesFile.exists()) {
    throw new GradleException("Missing release metadata: ${versionPropertiesFile}")
}
versionPropertiesFile.withInputStream { stream -> versionProperties.load(stream) }

def releaseProperty = { String key ->
    String value = versionProperties.getProperty(key)
    if (value == null || value.isBlank()) {
        throw new GradleException("Missing release property '${key}' in ${versionPropertiesFile}")
    }
    value.trim()
}

def pluginVersion = releaseProperty('pluginVersion')
def buildNumber = releaseProperty('buildNumber')
def javaTarget = Integer.parseInt(releaseProperty('javaTarget'))
if (javaTarget != 25) {
    throw new GradleException('This build requires Java 25 bytecode; javaTarget must remain 25.')
}
def targetPaperVersion = releaseProperty('paperVersion')
def targetPaperApiBuild = releaseProperty('paperApiBuild')
def targetPaperApiChannel = releaseProperty('paperApiChannel')
def targetPaperServerSha256 = releaseProperty('paperServerSha256')
def declaredApiVersion = releaseProperty('declaredApiVersion')
def targetCoreProtectVersion = releaseProperty('coreProtectVersion')
def targetCoreProtectApiVersion = releaseProperty('coreProtectApiVersion')
def coreProtectJar = file(providers.gradleProperty('coreProtectJar')
        .orElse("servers/compile-support/CoreProtect-${targetCoreProtectVersion}.jar").get())
def targetPaperApi = "${targetPaperVersion}.build.${targetPaperApiBuild}-${targetPaperApiChannel}"
def pluginBuildVersion = "${pluginVersion}-${buildNumber}-j${javaTarget}-${targetPaperVersion}"

if (!coreProtectJar.isFile()) {
    throw new GradleException("CoreProtect ${targetCoreProtectVersion} jar not found: ${coreProtectJar}. "
            + 'Supply the target jar with -PcoreProtectJar=/path/to/CoreProtect.jar.')
}

if (!(pluginVersion ==~ /\d+\.\d+\.\d+/)) {
    throw new GradleException("pluginVersion must be semantic x.y.z, found '${pluginVersion}'")
}
if (!(buildNumber ==~ /\d{3}/)) {
    throw new GradleException("buildNumber must contain exactly three digits, found '${buildNumber}'")
}
if (targetPaperApiChannel != 'stable') {
    throw new GradleException('The maintained Paper target must use a verified stable release.')
}
if (!(targetPaperServerSha256 ==~ /[a-f0-9]{64}/)) {
    throw new GradleException('paperServerSha256 must be the SHA-256 from the pinned Fill build metadata.')
}
if (declaredApiVersion != targetPaperVersion || !(declaredApiVersion ==~ /\d+\.\d+(\.\d+)?/)) {
    throw new GradleException('declaredApiVersion must match the Minecraft version, without a build or channel suffix.')
}

group = 'com.onemoreblock'
version = pluginBuildVersion

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaTarget)
    toolchain.vendor = JvmVendorSpec.ORACLE
}

def oracleCompiler = javaToolchains.compilerFor {
    languageVersion = JavaLanguageVersion.of(25)
    vendor = JvmVendorSpec.ORACLE
}
def oracleTestLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(27)
    vendor = JvmVendorSpec.ORACLE
}
def buildJavaHome = file(System.getenv('ONE_MB_BUILD_JAVA_HOME')).canonicalFile
def testJavaHome = file(System.getenv('ONE_MB_TEST_JAVA_HOME')).canonicalFile
def verifySelectedTool = { tool, File expectedHome, int major ->
    def metadata = tool.metadata
    if (metadata.installationPath.asFile.canonicalFile != expectedHome
            || metadata.languageVersion.asInt() != major || metadata.vendor != 'Oracle') {
        throw new GradleException("Unexpected Java toolchain: ${metadata}. Expected Oracle ${major} at ${expectedHome}; use ./scripts/gradle.sh.")
    }
}
verifySelectedTool(oracleCompiler.get(), buildJavaHome, 25)
verifySelectedTool(oracleTestLauncher.get(), testJavaHome, 27)

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = uri('https://repo.papermc.io/repository/maven-public/')
    }
}

configurations {
    library
    implementation.extendsFrom(library)
}

sourceSets {
    smokeTest {
        compileClasspath += sourceSets.main.output
    }
}
configurations.smokeTestCompileOnly.extendsFrom(configurations.compileOnly)

dependencyLocking {
    lockAllConfigurations()
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:${targetPaperApi}")
    compileOnly(files(coreProtectJar))
    testImplementation(files(coreProtectJar))
    library("org.apache.commons:commons-dbcp2:2.14.0")
    // Paper's published metadata supplies its runtime APIs (Adventure, SLF4J, Gson, JSpecify).

    testImplementation("io.papermc.paper:paper-api:${targetPaperApi}")
    testImplementation(platform("org.junit:junit-bom:5.13.4"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

processResources {
    inputs.properties([
            pluginName               : internalPluginName.toString(),
            pluginVersion            : pluginVersion.toString(),
            buildNumber              : buildNumber.toString(),
            targetPaperVersion       : targetPaperVersion.toString(),
            targetPaperApi           : targetPaperApi.toString(),
            targetPaperApiBuild      : targetPaperApiBuild.toString(),
            targetPaperApiChannel    : targetPaperApiChannel.toString(),
            declaredApiVersion       : declaredApiVersion.toString(),
            javaTarget               : javaTarget.toString(),
            version                  : version.toString(),
            targetCoreProtectVersion : targetCoreProtectVersion.toString(),
            targetCoreProtectApiVersion: targetCoreProtectApiVersion.toString()
    ])
    filteringCharset = 'UTF-8'
    filesMatching(['plugin.yml', 'xrayheuristics/build-info.properties']) {
        filter ReplaceTokens, tokens: [
                pluginName                : internalPluginName.toString(),
                pluginVersion             : pluginVersion.toString(),
                buildNumber               : buildNumber.toString(),
                targetPaperVersion        : targetPaperVersion.toString(),
                targetPaperApi            : targetPaperApi.toString(),
                targetPaperApiBuild       : targetPaperApiBuild.toString(),
                targetPaperApiChannel     : targetPaperApiChannel.toString(),
                declaredApiVersion        : declaredApiVersion.toString(),
                javaTarget                : javaTarget.toString(),
                version                   : version.toString(),
                targetCoreProtectVersion  : targetCoreProtectVersion.toString(),
                targetCoreProtectApiVersion: targetCoreProtectApiVersion.toString()
        ]
    }
}

tasks.withType(JavaCompile).configureEach {
    javaCompiler = oracleCompiler
    javaCompiler.disallowChanges()
    options.release = javaTarget
    options.release.disallowChanges()
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:-options']
}

tasks.withType(Test).configureEach {
    javaLauncher = oracleTestLauncher
    javaLauncher.disallowChanges()
    // Child processes started by tests inherit the same validated test runtime.
    environment 'JAVA_HOME', testJavaHome.absolutePath
    environment 'PATH', "${testJavaHome}/bin${File.pathSeparator}${System.getenv('PATH')}"
    systemProperty 'oneMb.expectedTestJavaHome', testJavaHome.absolutePath
    useJUnitPlatform()
    jvmArgs '--illegal-final-field-mutation=deny'
}

tasks.register('testJava27', Test) {
    description = 'Reruns the full suite on Oracle Java 27 with a separate report (the default test task also uses 27).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter tasks.test
}

tasks.register('verifyJavaBytecode') {
    description = 'Verifies every compiled main, test and smoke-probe class targets Java 25 without preview features.'
    group = 'verification'
    dependsOn tasks.withType(JavaCompile)
    doLast {
        sourceSets.each { sourceSet ->
            def classes = sourceSet.output.classesDirs.asFileTree.matching { include '**/*.class' }
            if (classes.isEmpty()) {
                throw new GradleException("No compiled classes to verify for ${sourceSet.name}")
            }
            classes.each { classFile ->
                classFile.withDataInputStream { input ->
                    if (input.readInt() != (int) 0xCAFEBABE || input.readUnsignedShort() != 0
                            || input.readUnsignedShort() != 69) {
                        throw new GradleException("Expected Java 25 class-file version 69.0: ${classFile}")
                    }
                }
            }
            println "Verified ${classes.files.size()} ${sourceSet.name} classes: Java 25 bytecode (69.0)"
        }
    }
}

tasks.register('smokeTestJar', Jar) {
    description = 'Builds the isolated Paper compatibility probe; never install it on a live server.'
    group = 'verification'
    dependsOn tasks.jar
    from sourceSets.smokeTest.output
    archiveFileName.set('CompatibilityProbe.jar')
    destinationDirectory.set(layout.buildDirectory.dir('smoke'))
}

tasks.named('processSmokeTestResources') {
    inputs.property('declaredApiVersion', declaredApiVersion)
    filesMatching('plugin.yml') {
        filter ReplaceTokens, tokens: [declaredApiVersion: declaredApiVersion]
    }
}

tasks.register('printBuildConfig') {
    dependsOn 'verifyReleaseMetadata'
    doLast {
        println "Artifact name: ${artifactName}"
        println "Plugin name: ${internalPluginName}"
        println "Version: ${pluginBuildVersion}"
        println "Java target: ${javaTarget}"
        println "Build JVM: ${System.getProperty('java.runtime.version')} (${System.getProperty('java.vendor')}; ${System.getProperty('java.home')})"
        def compiler = tasks.named('compileJava').get().javaCompiler.get().metadata
        println "Java compiler (all sources, --release 25): ${compiler.javaRuntimeVersion} (${compiler.vendor}; ${compiler.installationPath}/bin/javac)"
        def testRuntime = tasks.named('test').get().javaLauncher.get().metadata
        println "Test JVM (all Test tasks): ${testRuntime.javaRuntimeVersion} (${testRuntime.vendor}; ${testRuntime.installationPath}/bin/java)"
        println "Compiled against Paper API: ${targetPaperApi}"
        println "Declared plugin api-version: ${declaredApiVersion}"
        println "CoreProtect target: ${targetCoreProtectVersion} (API ${targetCoreProtectApiVersion})"
        println "CoreProtect compile/test jar: ${coreProtectJar}"
    }
}

tasks.register('verifyReleaseMetadata') {
    dependsOn tasks.named('processResources')
    doLast {
        def requiredSnippets = [
                'README.md': [
                        "Current release: `${pluginBuildVersion}`",
                        "Paper compile target: `${targetPaperApi}`",
                        "CoreProtect compile target: `${targetCoreProtectVersion}` with API `${targetCoreProtectApiVersion}`",
                        "build/libs/${artifactName}-v${pluginBuildVersion}.jar"
                ],
                'docs/installation.md': [
                        "Current release: `${pluginBuildVersion}`",
                        "Paper compile target: `${targetPaperApi}`",
                        "CoreProtect compile target: `${targetCoreProtectVersion}` with API `${targetCoreProtectApiVersion}`",
                        "build/libs/${artifactName}-v${pluginBuildVersion}.jar"
                ],
                'docs/integrations.md': [
                        "Paper compile target: `${targetPaperApi}`",
                        "Java target: `${javaTarget}`",
                        "CoreProtect `${targetCoreProtectVersion}` with API `${targetCoreProtectApiVersion}`"
                ],
                'docs/plugin-docs.yml': [
                        "plugin_version: ${pluginVersion}",
                        "build_number: '${buildNumber}'",
                        "java_target: ${javaTarget}",
                        "paper_target: ${targetPaperVersion}",
                        "paper_api: ${targetPaperApi}",
                        "paper_channel: ${targetPaperApiChannel}"
                ],
                'AGENTS.md': ["`${targetPaperApi}`", 'channel `STABLE`'],
                'docs/compatibility-paper-26.3.md': ["`${pluginBuildVersion}`", "`${targetPaperApi}`", targetPaperServerSha256]
        ]

        requiredSnippets.each { path, snippets ->
            String content = file(path).getText('UTF-8')
            snippets.each { snippet ->
                if (!content.contains(snippet)) {
                    throw new GradleException("${path} is missing release metadata: ${snippet}")
                }
            }
        }

        def staleMarkers = ['2.0.0', '26.2.build.', 'buildNumber=028', '2.0.3-031', '25.0-rc1',
                            '26.3.build.41-alpha', '2.0.4-032', 'paper_channel: alpha', 'paper_channel: beta', '`ALPHA`', '`BETA`']
        def driftFiles = [
                file('README.md'),
                file('docs/installation.md'),
                file('docs/integrations.md'),
                file('docs/plugin-docs.yml'),
                file('AGENTS.md'),
                file('src/main/resources/plugin.yml'),
                file('src/main/resources/xrayheuristics/build-info.properties'),
                file('src/test/java/com/onemoreblock/coreprotectaddons/xrayheuristics/command/InfoSubcommandTest.java'),
                file('src/test/java/com/onemoreblock/coreprotectaddons/xrayheuristics/util/BuildMetadataTest.java')
        ]
        driftFiles.each { driftFile ->
            String content = driftFile.getText('UTF-8')
            staleMarkers.each { marker ->
                if (content.contains(marker)) {
                    throw new GradleException("${driftFile} still contains stale release marker '${marker}'")
                }
            }
        }

        String generatedPlugin = layout.buildDirectory.file('resources/main/plugin.yml').get().asFile.getText('UTF-8')
        String generatedBuildInfo = layout.buildDirectory.file('resources/main/xrayheuristics/build-info.properties').get().asFile.getText('UTF-8')
        [
                "version: ${pluginBuildVersion}",
                "api-version: ${declaredApiVersion}",
                "compiled against Paper API ${targetPaperApi}",
                "Java target ${javaTarget}"
        ].each { snippet ->
            if (!generatedPlugin.contains(snippet)) {
                throw new GradleException("Generated plugin.yml is missing '${snippet}'")
            }
        }
        [
                "artifactVersion=${pluginBuildVersion}",
                "paperApi=${targetPaperApi}",
                "javaTarget=${javaTarget}",
                "declaredApiVersion=${declaredApiVersion}",
                "coreProtectVersion=${targetCoreProtectVersion}",
                "coreProtectApiVersion=${targetCoreProtectApiVersion}"
        ].each { snippet ->
            if (!generatedBuildInfo.contains(snippet)) {
                throw new GradleException("Generated build-info.properties is missing '${snippet}'")
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyReleaseMetadata'), tasks.named('verifyJavaBytecode')
}

tasks.jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.library.collect { dependency ->
            dependency.isDirectory() ? dependency : zipTree(dependency)
        }
    }
    archiveFileName.set("${artifactName}-v${pluginBuildVersion}.jar")
}
